<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Quiz Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0c0a;--ink:#f3efe6;--dim:#8a8678;--line:#1f2120;--accent:#d6ff3a;--warn:#ff5b3a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;-webkit-font-smoothing:antialiased}
  body{display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  .brand b{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.02em}
  .brand b i{font-style:italic;font-weight:300;color:var(--dim)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.live{background:var(--accent);animation:pulse 1.4s infinite}
  .dot.err{background:var(--warn)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,255,58,.7)}70%{box-shadow:0 0 0 9px rgba(214,255,58,0)}100%{box-shadow:0 0 0 0 rgba(214,255,58,0)}}

  main{position:relative;overflow:hidden;background:#000}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{display:none}

  .reticle{position:absolute;inset:0;pointer-events:none}
  .reticle::before,.reticle::after{content:"";position:absolute;border:1px solid rgba(243,239,230,.35);width:14px;height:14px}
  .reticle::before{top:18px;left:18px;border-right:0;border-bottom:0}
  .reticle::after{bottom:18px;right:18px;border-left:0;border-top:0}
  .reticle .tr,.reticle .bl{position:absolute;width:14px;height:14px;border:1px solid rgba(243,239,230,.35)}
  .reticle .tr{top:18px;right:18px;border-left:0;border-bottom:0}
  .reticle .bl{bottom:18px;left:18px;border-right:0;border-top:0}

  .ring{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:46px;height:46px;display:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:2}
  .ring .bg{stroke:rgba(243,239,230,.18)}
  .ring .fg{stroke:var(--accent);stroke-dasharray:138.2;stroke-dashoffset:138.2;transition:stroke-dashoffset .25s linear}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:500}

  .answer{
    position:absolute;left:14px;right:14px;bottom:14px;
    background:rgba(11,12,10,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(214,255,58,.35);border-radius:18px;
    padding:18px 20px 22px;display:grid;gap:10px;
    opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;
  }
  .answer.show{opacity:1;transform:translateY(0)}
  .answer .meta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}
  .answer .meta span:last-child{color:var(--dim)}
  .answer .text{font-family:'Fraunces',serif;font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.025em;text-transform:capitalize}
  .answer.thinking{border-color:rgba(243,239,230,.12)}
  .answer.thinking .meta{color:var(--dim)}
  .answer.thinking .text{color:var(--dim);font-style:italic;font-size:20px;font-weight:400;text-transform:none}
  .answer.error{border-color:rgba(255,91,58,.5)}
  .answer.error .meta{color:var(--warn)}
  .answer.error .text{color:var(--warn);font-size:16px;font-weight:500;text-transform:none;line-height:1.4}

  /* SPLASH */
  .splash{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;padding:28px 24px;z-index:5;overflow-y:auto}
  .splash-inner{width:100%;max-width:360px;display:grid;gap:0;text-align:center}
  .splash h1{font-family:'Fraunces',serif;font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1;margin-bottom:10px}
  .splash h1 b{font-weight:700;font-style:italic}
  .splash p{color:var(--dim);font-size:12px;line-height:1.6;margin-bottom:28px}

  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}

  .key-wrap{position:relative}
  .key-wrap input{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px 44px 12px 14px;font:inherit;font-size:13px;
    letter-spacing:.05em;
  }
  .key-wrap input:focus{outline:none;border-color:var(--accent)}
  .key-wrap input.ok{border-color:rgba(214,255,58,.6)}
  .toggle-eye{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px;
  }
  .key-hint{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.5}
  .key-hint a{color:var(--accent);text-decoration:none}

  .field textarea{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:10px 14px;font:inherit;font-size:12px;resize:none;height:68px;
  }
  .field textarea:focus{outline:none;border-color:var(--ink)}

  .begin-btn{
    width:100%;background:var(--accent);color:#0b0c0a;border:0;padding:17px;border-radius:999px;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    cursor:pointer;margin-top:8px;
  }
  .begin-btn:active{transform:scale(.97)}
  .begin-btn:disabled{opacity:.45;pointer-events:none}

  footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line)}
  .stat{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .stat b{color:var(--ink);font-weight:500}
  .stop{
    width:62px;height:62px;border-radius:50%;border:2px solid var(--ink);
    background:transparent;display:grid;place-items:center;cursor:pointer;justify-self:center;
    visibility:hidden;
  }
  .stop::after{content:"";width:18px;height:18px;background:var(--warn);border-radius:3px}
  .stop:active{transform:scale(.95)}
  .right{justify-self:end}
</style>
</head>
<body>

<header>
  <div class="brand"><b>EYE<i>/6s</i></b></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
</header>

<main>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div class="reticle"><i class="tr"></i><i class="bl"></i></div>

  <div class="ring" id="ring">
    <svg viewBox="0 0 46 46">
      <circle class="bg" cx="23" cy="23" r="22"/>
      <circle class="fg" id="ringFg" cx="23" cy="23" r="22"/>
    </svg>
    <span id="ringNum">6</span>
  </div>

  <div class="answer" id="answer">
    <div class="meta"><span>› answer</span><span id="ansTime"></span></div>
    <div class="text" id="ansText">—</div>
  </div>

  <div class="splash" id="splash">
    <div class="splash-inner">
      <h1>Quiz <b>Eye</b></h1>
      <p>Point camera at a question. Every 6 seconds it reads and picks the correct option.</p>

      <div class="field">
        <label>Gemini API Key (free)</label>
        <div class="key-wrap">
          <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" spellcheck="false"/>
          <button class="toggle-eye" id="toggleKey" type="button">👁</button>
        </div>
        <div class="key-hint">
          Get free key → <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a><br>
          Sign in with Google → Create API key → Copy
        </div>
      </div>

      <div class="field">
        <label>Instruction to AI</label>
        <textarea id="prompt">Read the multiple-choice question in the image. Reply with ONLY the correct option name, nothing else.</textarea>
      </div>

      <button class="begin-btn" id="startBtn">Begin</button>
    </div>
  </div>
</main>

<footer>
  <div class="stat">shots <b id="count">0</b></div>
  <button class="stop" id="stopBtn"></button>
  <div class="stat right">every <b>6s</b></div>
</footer>

<script>
const INTERVAL = 6000;
const RING_LEN = 138.2;
const $ = id => document.getElementById(id);

const els = {
  video:$('video'), canvas:$('canvas'), splash:$('splash'),
  startBtn:$('startBtn'), stopBtn:$('stopBtn'),
  apiKey:$('apiKey'), toggleKey:$('toggleKey'), prompt:$('prompt'),
  answer:$('answer'), ansText:$('ansText'), ansTime:$('ansTime'),
  ring:$('ring'), ringFg:$('ringFg'), ringNum:$('ringNum'),
  count:$('count'), statusText:$('statusText'), dot:$('dot'),
};

// Restore saved key
const saved = localStorage.getItem('gemini_key');
if(saved){ els.apiKey.value = saved; els.apiKey.classList.add('ok'); }

els.toggleKey.addEventListener('click',()=>{
  els.apiKey.type = els.apiKey.type==='password' ? 'text' : 'password';
});
els.apiKey.addEventListener('input',()=>{
  const v = els.apiKey.value.trim();
  els.apiKey.classList.toggle('ok', v.length > 10);
});

let stream=null, loopTimer=null, cdTimer=null, shots=0, busy=false;

function setStatus(t,m){ els.statusText.textContent=t; els.dot.className='dot'+(m?' '+m:''); }

function showAnswer(text, cls=''){
  els.answer.className = 'answer show ' + cls;
  els.ansText.textContent = text;
  if(cls !== 'thinking'){
    const n = new Date();
    els.ansTime.textContent = [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  }
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error(),'NO_API');
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
    els.video.srcObject = stream;
    await els.video.play();
    return true;
  }catch(e){
    const msg = e.name==='NotAllowedError' ? 'Camera permission denied. Tap the camera icon in the address bar and allow, then tap Begin again.'
      : e.name==='NotFoundError' ? 'No camera found.'
      : e.name==='NotReadableError' ? 'Camera busy — close other apps.'
      : 'Camera error: '+e.message;
    showAnswer(msg,'error'); setStatus('blocked','err'); return false;
  }
}

function capture(){
  const v = els.video, w = v.videoWidth||1280, h = v.videoHeight||720;
  const s = Math.min(1, 768/Math.max(w,h));
  const tw=Math.round(w*s), th=Math.round(h*s);
  els.canvas.width=tw; els.canvas.height=th;
  els.canvas.getContext('2d').drawImage(v,0,0,tw,th);
  return els.canvas.toDataURL('image/jpeg',0.75).split(',')[1];
}

async function askGemini(b64, key, prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
  const res = await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{ parts:[
        { inline_data:{ mime_type:'image/jpeg', data:b64 }},
        { text: prompt + '\n\nRespond with exactly ONE short line. No explanation, no formatting.' }
      ]}],
      generationConfig:{ maxOutputTokens:80, temperature:0.1 }
    })
  });
  const data = await res.json();
  if(!res.ok){
    const msg = data.error?.message || ('HTTP '+res.status);
    throw new Error(msg);
  }
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '…';
  return text.trim().replace(/\s+/g,' ').split('\n')[0].slice(0,200);
}

async function tick(){
  if(busy) return;
  busy=true; shots++; els.count.textContent=shots;
  showAnswer('seeing…','thinking');
  setStatus('thinking','live');
  const key = els.apiKey.value.trim();
  const prompt = (els.prompt.value||'').trim() || 'Read the question. Reply with only the correct option.';
  try{
    const ans = await askGemini(capture(), key, prompt);
    showAnswer(ans,''); setStatus('live','live');
  }catch(e){
    showAnswer(e.message,'error'); setStatus('error','err');
  }finally{ busy=false; }
}

function startRing(){
  let rem = INTERVAL; els.ring.style.display='block';
  els.ringFg.style.strokeDashoffset = '0';
  cdTimer = setInterval(()=>{
    rem -= 100;
    els.ringFg.style.strokeDashoffset = (RING_LEN * Math.max(0,1-rem/INTERVAL)).toFixed(2);
    els.ringNum.textContent = Math.max(0,Math.ceil(rem/1000));
    if(rem <= 0) rem = INTERVAL;
  },100);
}

async function begin(){
  const key = els.apiKey.value.trim();
  if(!key){ showAnswer('Paste your Gemini API key first.','error'); return; }
  if(!key.startsWith('AIza')){ showAnswer('Key should start with "AIza…" — check you copied it fully.','error'); return; }
  localStorage.setItem('gemini_key', key);
  els.startBtn.disabled = true; setStatus('starting','');
  const ok = await startCamera();
  if(!ok){ els.startBtn.disabled=false; return; }
  els.splash.style.display='none';
  els.stopBtn.style.visibility='visible';
  setStatus('live','live');
  await tick();
  startRing();
  loopTimer = setInterval(tick, INTERVAL);
}

function stop(){
  clearInterval(loopTimer); clearInterval(cdTimer);
  loopTimer = cdTimer = null;
  stream?.getTracks().forEach(t=>t.stop()); stream=null;
  els.video.srcObject=null;
  els.splash.style.display='grid';
  els.stopBtn.style.visibility='hidden';
  els.ring.style.display='none';
  els.startBtn.disabled=false;
  setStatus('idle','');
  els.answer.classList.remove('show');
}

els.startBtn.addEventListener('click', begin);
els.stopBtn.addEventListener('click', stop);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && loopTimer) stop(); });
</script>
</body>
</html>
